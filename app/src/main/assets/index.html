<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2ece1">
<title>墨读</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#f2ece1;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#2c2825;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ============ 通用 ============ */
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.safe-t{padding-top:env(safe-area-inset-top,0px)}
.safe-b{padding-bottom:env(safe-area-inset-bottom,0px)}

/* ============ 书架 ============ */
#shelf{background:#f2ece1;background-image:radial-gradient(circle at 20% 0%,#fbf6ec 0%,#f2ece1 45%)}
.shelf-head{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;flex:0 0 auto}
.head-top{display:flex;align-items:center;justify-content:space-between;height:44px}
.head-top h1{font-size:25px;font-weight:700;letter-spacing:.5px}
.head-actions{display:flex;gap:4px}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:12px;color:#4a433b;transition:background .15s}
.icon-btn:active{background:rgba(0,0,0,.06)}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

.search-wrap{max-height:0;overflow:hidden;transition:max-height .25s ease}
.search-wrap.open{max-height:64px}
.search-wrap input{width:100%;height:42px;margin-top:10px;border-radius:12px;border:0;
  background:#fffdf8;padding:0 14px;font-size:15px;box-shadow:0 1px 3px rgba(120,100,70,.08);outline:none}
.search-wrap input::placeholder{color:#b3a795}

.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:20px;background:rgba(255,255,255,.65);
  font-size:13.5px;color:#6d6357;white-space:nowrap;transition:all .18s;border:1px solid transparent}
.chip.on{background:#2c2825;color:#f6f1e7;font-weight:500}
.chip .cnt{opacity:.5;margin-left:4px;font-size:12px}
.chip.add{border:1px dashed #c6b9a4;color:#8a7d6b;background:transparent}

.shelf-body{flex:1 1 auto;overflow-y:auto;padding:2px 20px calc(96px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch}
.book-item{display:flex;gap:14px;padding:12px;border-radius:18px;background:#fffdfa;
  box-shadow:0 2px 10px rgba(120,100,70,.07);margin-bottom:12px;transition:transform .15s;position:relative}
.book-item:active{transform:scale(.985)}
.cover{width:52px;height:70px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;color:rgba(255,255,255,.92);font-size:20px;font-weight:600;
  letter-spacing:1px;box-shadow:inset -3px 0 6px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.12);
  position:relative;overflow:hidden;padding-left:5px}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:rgba(0,0,0,.18)}
.bi-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.bi-title{font-size:15.5px;font-weight:600;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.bi-sub{font-size:12px;color:#a09483;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.bi-tag{padding:2px 8px;border-radius:6px;background:#f4ede0;color:#9c8a70;font-size:11px}
.bi-progress{height:3px;border-radius:2px;background:#eee7da;overflow:hidden;margin-top:2px}
.bi-progress i{display:block;height:100%;background:#b08d62;border-radius:2px;transition:width .3s}
.bi-more{position:absolute;right:6px;top:6px;width:34px;height:34px;display:flex;
  align-items:center;justify-content:center;color:#c3b8a8;border-radius:10px}
.bi-more svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

.empty{display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 30px;text-align:center;color:#a2957f;gap:16px}
.empty.show{display:flex}
.empty svg{width:64px;height:64px;stroke:#cdbfa8;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:16px;font-weight:500;color:#7d7160}
.empty p{font-size:13px;line-height:1.7;color:#a2957f}
.empty button{margin-top:6px;padding:11px 26px;border-radius:24px;background:#2c2825;color:#f6f1e7;font-size:14px}

.fab{position:fixed;right:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;background:#2c2825;color:#f6f1e7;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(44,40,37,.32);
  transition:transform .15s;z-index:20}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}

/* ============ 阅读器 ============ */
#reader{background:var(--r-bg,#fbf7ef);color:var(--r-fg,#37312a);display:none}
#reader.active{display:block}
#reader[data-theme="paper"]{--r-bg:#fbf7ef;--r-fg:#37312a;--r-sub:#a0957f;--r-line:rgba(0,0,0,.06)}
#reader[data-theme="warm"]{--r-bg:#f3e6cf;--r-fg:#4a3a26;--r-sub:#a08b6d;--r-line:rgba(0,0,0,.07)}
#reader[data-theme="green"]{--r-bg:#d7e6cf;--r-fg:#2e392b;--r-sub:#7f9077;--r-line:rgba(0,0,0,.07)}
#reader[data-theme="gray"]{--r-bg:#e8e8e6;--r-fg:#32322f;--r-sub:#8f8f8a;--r-line:rgba(0,0,0,.07)}
#reader[data-theme="night"]{--r-bg:#14161a;--r-fg:#9b9b9b;--r-sub:#5e6167;--r-line:rgba(255,255,255,.07)}
#reader[data-theme="sepia"]{--r-bg:#241d18;--r-fg:#c2ad92;--r-sub:#7d6c58;--r-line:rgba(255,255,255,.07)}

.brightness{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60}

.pager{position:absolute;left:0;right:0;
  top:calc(env(safe-area-inset-top,0px) + 28px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  overflow:hidden;transition:transform .26s cubic-bezier(.3,.8,.4,1)}
.pager.mode-scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pager-inner{will-change:transform;transition:transform .26s cubic-bezier(.3,.8,.4,1)}
.pager-inner h2{font-size:1.16em;font-weight:600;margin:.2em 0 1.1em;letter-spacing:.02em;color:inherit}
.pager-inner p{text-indent:2em;margin:0 0 .72em;text-align:justify;word-break:break-word}
.pager-inner p:first-of-type{margin-top:0}
.pager-inner.empty-ch{color:var(--r-sub);text-align:center;padding-top:40%}

.r-bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;
  background:rgba(250,247,241,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:50;transition:transform .28s cubic-bezier(.3,.8,.4,1),opacity .2s;opacity:0;pointer-events:none}
#reader[data-theme="night"] .r-bar,#reader[data-theme="sepia"] .r-bar{background:rgba(24,26,30,.92)}
#reader[data-theme="warm"] .r-bar{background:rgba(246,236,219,.93)}
#reader[data-theme="green"] .r-bar{background:rgba(224,236,217,.93)}
#reader[data-theme="gray"] .r-bar{background:rgba(238,238,236,.93)}
.r-bar.show{opacity:1;pointer-events:auto;transform:translateY(0)!important}
.r-top{top:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 8px;
  transform:translateY(-110%);box-shadow:0 1px 0 var(--r-line)}
.r-bottom{bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  flex-direction:column;gap:8px;transform:translateY(110%);box-shadow:0 -1px 0 var(--r-line)}
.r-top .back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.r-top .back svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.r-top .rh{flex:1 1 auto;min-width:0;text-align:center}
.rh-book{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh-chap{font-size:11.5px;color:var(--r-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-top .bm{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--r-sub)}
.r-top .bm.on{color:#c08a4a}
.r-top .bm svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.r-top .bm.on svg{fill:currentColor}

.prog-row{display:flex;align-items:center;gap:12px;width:100%}
.prog-row .pl{font-size:11.5px;color:var(--r-sub);white-space:nowrap;min-width:52px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--r-line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:#b08d62;margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

.foot-actions{display:flex;justify-content:space-around;width:100%;margin-top:2px}
.foot-btn{padding:8px 6px;font-size:13px;color:var(--r-fg);opacity:.82;border-radius:10px;flex:1}
.foot-btn:active{background:var(--r-line)}

.r-pagenum{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9px);
  text-align:center;font-size:11px;color:var(--r-sub);pointer-events:none;z-index:5;letter-spacing:.06em}

/* ============ 抽屉 ============ */
.mask{position:fixed;inset:0;background:rgba(20,18,15,.42);opacity:0;visibility:hidden;
  transition:opacity .25s,visibility .25s;z-index:100;backdrop-filter:blur(2px)}
.mask.show{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fffdf9;border-radius:22px 22px 0 0;
  z-index:110;transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -6px 30px rgba(60,45,30,.16)}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:#e2d7c6;margin:9px auto 0;flex:0 0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;flex:0 0 auto}
.sheet-head h2{font-size:16px;font-weight:600}
.sheet-head .done{font-size:14px;color:#9c7c4f;padding:4px 8px}
.sheet-body{overflow-y:auto;padding:4px 20px 18px;-webkit-overflow-scrolling:touch}

/* 目录 */
.toc-item{display:flex;align-items:center;gap:10px;padding:13px 4px;font-size:14.5px;
  border-bottom:1px solid #f3ece0;color:#4a433b}
.toc-item.on{color:#a8733c;font-weight:600}
.toc-item .n{flex:0 0 auto;font-size:11.5px;color:#c3b6a3;min-width:26px}
.toc-item .t{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-item.on .n{color:#c9a071}

/* 设置 */
.set-group{margin-bottom:20px}
.set-label{font-size:12px;color:#a2957f;margin-bottom:10px;letter-spacing:.04em}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:10px 4px;border-radius:11px;background:#f5eee2;
  font-size:13.5px;color:#6d6357;transition:all .15s;border:1px solid transparent}
.seg button.on{background:#2c2825;color:#f6f1e7;font-weight:500}
.stepper{display:flex;align-items:center;gap:0;background:#f5eee2;border-radius:12px;overflow:hidden}
.stepper button{width:56px;height:44px;font-size:20px;color:#6d6357;display:flex;align-items:center;justify-content:center}
.stepper .val{flex:1;text-align:center;font-size:14px;color:#4a433b}
.themes{display:flex;gap:12px}
.tdot{width:42px;height:42px;border-radius:50%;position:relative;border:2px solid transparent;
  transition:all .15s;display:flex;align-items:center;justify-content:center}
.tdot.on{border-color:#b08d62;transform:scale(1.06)}
.tdot i{display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.tdot span{position:absolute;bottom:-17px;font-size:10px;color:#a2957f;white-space:nowrap}
.themes-wrap{padding-bottom:16px}
.br-row{display:flex;align-items:center;gap:12px}
.br-row svg{width:18px;height:18px;stroke:#a2957f;stroke-width:1.7;fill:none;flex:0 0 auto}
.br-row input[type=range]{flex:1}
.br-row input[type=range]::-webkit-slider-thumb{background:#8f8778}

/* 书籍操作 */
.act-item{display:flex;align-items:center;gap:14px;padding:15px 6px;font-size:15px;
  border-bottom:1px solid #f3ece0;color:#3f3931;width:100%;text-align:left}
.act-item:last-child{border-bottom:0}
.act-item svg{width:20px;height:20px;stroke:#a2957f;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.act-item.danger{color:#c25a4d}
.act-item.danger svg{stroke:#c25a4d}
.act-sub{font-size:12px;color:#b0a494;margin-left:auto}

/* 分类编辑 */
.cat-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid #f3ece0}
.cat-row .name{flex:1;font-size:15px}
.cat-row .del{color:#c3b6a3;font-size:13px;padding:6px 10px}
.cat-row .pick{width:22px;height:22px;border-radius:50%;border:2px solid #ddd2bf;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cat-row .pick.on{background:#2c2825;border-color:#2c2825}
.cat-row .pick.on::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.cat-input-row{display:flex;gap:10px;margin-top:14px}
.cat-input-row input{flex:1;height:44px;border-radius:12px;border:0;background:#f5eee2;padding:0 14px;font-size:14px;outline:none}

/* 提示 */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,12px);background:rgba(44,40,37,.94);color:#f6f1e7;
  padding:11px 20px;border-radius:22px;font-size:13.5px;z-index:300;opacity:0;
  transition:opacity .22s,transform .22s;pointer-events:none;max-width:82vw;text-align:center;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- ================= 书架 ================= -->
<div id="shelf" class="view active">
  <header class="shelf-head">
    <div class="head-top">
      <h1>书架</h1>
      <div class="head-actions">
        <button class="icon-btn" id="btnSearch" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="btnMore" aria-label="更多">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="searchInput" type="search" placeholder="搜索书名、作者或正文内容…" autocomplete="off">
    </div>
    <div class="cat-bar" id="catBar"></div>
  </header>
  <main class="shelf-body" id="shelfBody">
    <div id="bookList"></div>
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v18h4.5a2.5 2.5 0 0 0 2.5-2.5z"/></svg>
      <h3 id="emptyTitle">书架还是空的</h3>
      <p id="emptyDesc">点击右下角 ＋ 导入 txt 小说<br>支持一次选多本，自动识别章节</p>
      <button id="emptyBtn">导入小说</button>
    </div>
  </main>
  <button class="fab" id="btnImport" aria-label="导入">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <input type="file" id="fileInput" accept=".txt,text/plain" multiple hidden>
</div>

<!-- ================= 阅读器 ================= -->
<div id="reader" data-theme="paper">
  <div class="pager mode-page" id="pager">
    <div class="pager-inner" id="pagerInner"></div>
  </div>
  <div class="brightness" id="brightness"></div>
  <div class="r-pagenum" id="rPageNum"></div>

  <div class="r-bar r-top" id="rTop">
    <button class="back" id="btnBack" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="rh">
      <div class="rh-book" id="rhBook"></div>
      <div class="rh-chap" id="rhChap"></div>
    </div>
    <button class="bm" id="btnBookmark" aria-label="书签">
      <svg viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4.5L5 21V4.5a1 1 0 0 1 1-1z"/></svg>
    </button>
  </div>

  <div class="r-bar r-bottom" id="rBottom">
    <div class="prog-row">
      <span class="pl" id="progLeft">0%</span>
      <input type="range" id="progressRange" min="0" max="100" value="0">
      <span class="pl" id="progRight">0/0</span>
    </div>
    <div class="foot-actions">
      <button class="foot-btn" id="btnToc">目录</button>
      <button class="foot-btn" id="btnPrevCh">上一章</button>
      <button class="foot-btn" id="btnNextCh">下一章</button>
      <button class="foot-btn" id="btnSettings">设置</button>
    </div>
  </div>
</div>

<!-- ================= 遮罩 ================= -->
<div class="mask" id="mask"></div>

<!-- 目录抽屉 -->
<div class="sheet" id="tocSheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <h2>目录</h2>
    <button class="done" data-close>完成</button>
  </div>
  <div class="sheet-body" id="tocBody"></div>
</div>

<!-- 设置抽屉 -->
<div class="sheet" id="setSheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <h2>阅读设置</h2>
    <button class="done" data-close>完成</button>
  </div>
  <div class="sheet-body">
    <div class="set-group">
      <div class="set-label">字号</div>
      <div class="stepper">
        <button data-font="-1">A−</button>
        <div class="val" id="fontVal">20</div>
        <button data-font="1">A＋</button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-label">字体</div>
      <div class="seg" id="fontSeg">
        <button data-f="sys">系统</button>
        <button data-f="song">宋体</button>
        <button data-f="kai">楷体</button>
        <button data-f="hei">黑体</button>
        <button data-f="yuan">圆体</button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-label">行距</div>
      <div class="seg" id="lhSeg">
        <button data-lh="1.65">紧凑</button>
        <button data-lh="1.9">适中</button>
        <button data-lh="2.25">宽松</button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-label">页边距</div>
      <div class="seg" id="padSeg">
        <button data-pad="16">窄</button>
        <button data-pad="22">中</button>
        <button data-pad="30">宽</button>
      </div>
    </div>
    <div class="set-group">
      <div class="set-label">背景</div>
      <div class="themes" id="themeSeg">
        <button class="tdot" data-t="paper"><i style="background:#fbf7ef"></i><span>纸白</span></button>
        <button class="tdot" data-t="warm"><i style="background:#f3e6cf"></i><span>牛皮</span></button>
        <button class="tdot" data-t="green"><i style="background:#d7e6cf"></i><span>护眼</span></button>
        <button class="tdot" data-t="gray"><i style="background:#e8e8e6"></i><span>灰白</span></button>
        <button class="tdot" data-t="night"><i style="background:#14161a"></i><span>夜间</span></button>

<script>
'use strict';

/* ==================== 常量 ==================== */
const FONTS = {
  sys: '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif',
  song: '"Songti SC","SimSun","STSong",serif',
  kai: '"Kaiti SC","KaiTi","STKaiti",serif',
  hei: '"Heiti SC","Microsoft YaHei","SimHei",sans-serif',
  yuan: '"Yuanti SC","YouYuan","PingFang SC",sans-serif'
};
const COVERS = [
  ['#8d6b4e', '#5b4230'], ['#6b7c8d', '#3f4c58'], ['#8d5e5e', '#593a3a'],
  ['#5e7a6b', '#38493d'], ['#7a6b8d', '#4a4058'], ['#8d8161', '#584f33'],
  ['#7d8b6b', '#48533d'], ['#8b6b8d', '#513e56']
];
const DEFAULT_SETTINGS = {
  fontSize: 20, font: 'sys', lineHeight: 1.9, pad: 22,
  theme: 'paper', mode: 'page', brightness: 0
};

/* ==================== 状态 ==================== */
const state = {
  books: [], categories: [], curCat: 'all', query: '',
  cur: null, chIdx: 0, page: 0, totalPages: 1, step: 0,
  mode: 'page', settings: { ...DEFAULT_SETTINGS },
  actBookId: null, catPickBookId: null, ready: false
};

/* ==================== DOM ==================== */
const $ = id => document.getElementById(id);
const shelfEl = $('shelf'), readerEl = $('reader');
const bookListEl = $('bookList'), emptyEl = $('emptyState'), catBarEl = $('catBar');
const pagerEl = $('pager'), innerEl = $('pagerInner');
const rTop = $('rTop'), rBottom = $('rBottom'), rPageNum = $('rPageNum');
const maskEl = $('mask'), toastEl = $('toast');

/* ==================== 工具 ==================== */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtCount(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万字';
  return n + ' 字';
}
function fmtTime(t) {
  const d = new Date(t), now = new Date();
  const diff = (now - d) / 86400000;
  if (diff < 1 && d.getDate() === now.getDate()) return '今天';
  if (diff < 2) return '昨天';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

/* ==================== 数据库 ==================== */
const DB_NAME = 'modu-reader', DB_VER = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = () => reject(req.error);
  });
}
function store(name, mode) { return db.transaction(name, mode).objectStore(name); }
function dbAll(name) {
  return new Promise((res, rej) => {
    const r = store(name, 'readonly').getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function dbGet(name, key) {
  return new Promise((res, rej) => {
    const r = store(name, 'readonly').get(key);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(name, val) {
  return new Promise((res, rej) => {
    const r = store(name, 'readwrite').put(val);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbDel(name, key) {
  return new Promise((res, rej) => {
    const r = store(name, 'readwrite').delete(key);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function metaGet(k, def) {
  return dbGet('meta', k).then(v => (v && v.v !== undefined) ? v.v : def);
}
function metaSet(k, v) { return dbPut('meta', { k: k, v: v }); }

/* ==================== 文本解析 ==================== */
function decodeBuffer(buf) {
  let text;
  try {
    text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch (e) {
    try { text = new TextDecoder('gbk').decode(buf); }
    catch (_) { text = new TextDecoder('utf-8').decode(buf); }
  }
  return text.replace(/^\uFEFF/, '');
}

const CH_LINE = /^[\s\u3000]*(第[0-9零一二三四五六七八九十百千两]{1,12}[章回节卷篇集话幕][^\n]{0,28}|Chapter\s+\d+[^\n]{0,28}|序章[^\n]{0,20}|楔子[^\n]{0,20}|尾声[^\n]{0,20}|后记[^\n]{0,20})[\s\u3000]*$/;

function splitChapters(text) {
  const lines = text.split(/\r\n|\r|\n/);
  const hits = [];
  for (let i = 0; i < lines.length; i++) {
    if (CH_LINE.test(lines[i])) hits.push(i);
  }
  const chapters = [];
  if (hits.length >= 2) {
    // 章节标题之前的内容作为「前言」
    if (hits[0] > 0) {
      const pre = lines.slice(0, hits[0]).join('\n').trim();
      if (pre.length > 40) chapters.push({ title: '前言', text: pre });
    }
    for (let k = 0; k < hits.length; k++) {
      const start = hits[k];
      const end = (k + 1 < hits.length) ? hits[k + 1] : lines.length;
      const title = lines[start].trim();
      const body = lines.slice(start + 1, end).join('\n').trim();
      chapters.push({ title: title, text: body });
    }
  }
  if (chapters.length === 0) {
    const clean = text.trim();
    const CHUNK = 2200;
    if (clean.length <= CHUNK * 1.6) {
      chapters.push({ title: '正文', text: clean });
    } else {
      let i = 0, n = 1;
      while (i < clean.length) {
        chapters.push({ title: '第 ' + n + ' 节', text: clean.slice(i, i + CHUNK) });
        i += CHUNK; n++;
      }
    }
  }
  return chapters;
}

function guessMeta(filename, text) {
  let title = filename.replace(/\.txt$/i, '').trim();
  let author = '';
  const head = text.slice(0, 400);
  const t = head.match(/《([^》]{1,40})》/);
  if (t) title = t[1].trim();
  const a = head.match(/(?:作\s*者|著\s*者)\s*[:：]?\s*([^\s\n，,。]{1,16})/);
  if (a) author = a[1].trim();
  return { title: title || '未命名', author: author };
}
/* ==================== 设置 ==================== */
async function loadSettings() {
  const saved = await metaGet('settings', null);
  if (saved) state.settings = Object.assign({}, DEFAULT_SETTINGS, saved);
  state.mode = state.settings.mode || 'page';
  applyReaderStyle();
  syncSettingUI();
}
function saveSettings() { metaSet('settings', state.settings); }
function applyReaderStyle() {
  const s = state.settings;
  readerEl.dataset.theme = s.theme;
  innerEl.style.fontSize = s.fontSize + 'px';
  innerEl.style.fontFamily = FONTS[s.font] || FONTS.sys;
  innerEl.style.lineHeight = s.lineHeight;
  $('brightness').style.opacity = (s.brightness / 100).toFixed(2);
}
function syncSettingUI() {
  const s = state.settings;
  $('fontVal').textContent = s.fontSize;
  document.querySelectorAll('#fontSeg button').forEach(b => b.classList.toggle('on', b.dataset.f === s.font));
  document.querySelectorAll('#lhSeg button').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.lh) === s.lineHeight));
  document.querySelectorAll('#padSeg button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.pad) === s.pad));
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === s.theme));
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === state.mode));
  $('brightRange').value = s.brightness;
}

/* ==================== 书架渲染 ==================== */
function coverStyle(id) {
  let h = 7;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  const c = COVERS[h % COVERS.length];
  return 'background:linear-gradient(150deg,' + c[0] + ' 0%,' + c[1] + ' 100%)';
}
function bookProgress(b) {
  if (!b.progress || !b.chapters || !b.chapters.length) return 0;
  const ratio = (b.progress.ch || 0) + (b.progress.ratio || 0);
  return Math.min(100, Math.max(0, ratio / b.chapters.length * 100));
}
function visibleBooks() {
  const q = state.query.trim().toLowerCase();
  let list = state.books.slice();
  if (state.curCat !== 'all') list = list.filter(b => (b.category || '') === state.curCat);
  if (q) {
    list = list.filter(b => {
      if ((b.title || '').toLowerCase().indexOf(q) >= 0) return true;
      if ((b.author || '').toLowerCase().indexOf(q) >= 0) return true;
      if ((b.category || '').toLowerCase().indexOf(q) >= 0) return true;
      if ((b.content || '').toLowerCase().indexOf(q) >= 0) return true;
      return false;
    });
  }
  list.sort((a, b) => (b.lastReadAt || b.createdAt) - (a.lastReadAt || a.createdAt));
  return list;
}
function renderShelf() {
  const list = visibleBooks();
  const searching = !!state.query.trim();
  bookListEl.innerHTML = list.map(b => {
    const p = Math.round(bookProgress(b));
    const first = (b.title || '书').charAt(0);
    const subBits = [];
    if (b.category) subBits.push('<span class="bi-tag">' + esc(b.category) + '</span>');
    subBits.push('<span>' + fmtCount(b.wordCount || 0) + '</span>');
    if (b.author) subBits.push('<span>' + esc(b.author) + '</span>');
    subBits.push('<span>' + fmtTime(b.lastReadAt || b.createdAt) + '</span>');
    return '<div class="book-item" data-id="' + b.id + '">' +
      '<div class="cover" style="' + coverStyle(b.id) + '">' + esc(first) + '</div>' +
      '<div class="bi-main">' +
        '<div class="bi-title">' + esc(b.title) + '</div>' +
        '<div class="bi-sub">' + subBits.join('') + '</div>' +
        '<div class="bi-progress"><i style="width:' + p + '%"></i></div>' +
      '</div>' +
      '<button class="bi-more" data-more="' + b.id + '">' +
        '<svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.6" fill="currentColor" stroke="none"/>' +
        '<circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/>' +
        '<circle cx="12" cy="18" r="1.6" fill="currentColor" stroke="none"/></svg>' +
      '</button>' +
    '</div>';
  }).join('');

  const isEmpty = list.length === 0;
  emptyEl.classList.toggle('show', isEmpty);
  if (isEmpty) {
    if (searching) {
      $('emptyTitle').textContent = '没有找到相关书籍';
      $('emptyDesc').innerHTML = '换个关键词试试，<br>或检查是否在正确的分类下';
      $('emptyBtn').style.display = 'none';
    } else {
      $('emptyTitle').textContent = '书架还是空的';
      $('emptyDesc').innerHTML = '点击右下角 ＋ 导入 txt 小说<br>支持一次选多本，自动识别章节';
      $('emptyBtn').style.display = '';
    }
  }
  renderCats();
}
function renderCats() {
  const counts = {};
  state.books.forEach(b => { const k = b.category || ''; counts[k] = (counts[k] || 0) + 1; });
  let html = '<button class="chip ' + (state.curCat === 'all' ? 'on' : '') + '" data-cat="all">全部<span class="cnt">' + state.books.length + '</span></button>';
  state.categories.forEach(c => {
    html += '<button class="chip ' + (state.curCat === c ? 'on' : '') + '" data-cat="' + esc(c) + '">' +
      esc(c) + '<span class="cnt">' + (counts[c] || 0) + '</span></button>';
  });
  html += '<button class="chip add" data-cat="__add">＋ 分类</button>';
  catBarEl.innerHTML = html;
}

/* ==================== 导入 ==================== */
async function handleFiles(files) {
  if (!files || !files.length) return;
  const arr = Array.prototype.slice.call(files);
  toast('正在解析 ' + arr.length + ' 个文件…');
  let ok = 0, fail = 0;
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i];
    try {
      const buf = await f.arrayBuffer();
      const text = decodeBuffer(buf);
      if (!text.trim()) throw new Error('empty');
      const meta = guessMeta(f.name, text);
      const chapters = splitChapters(text);
      if (!chapters.length) throw new Error('no-chapter');
      const book = {
        id: uid(),
        title: meta.title,
        author: meta.author,
        category: state.curCat !== 'all' ? state.curCat : '',
        content: text,
        chapters: chapters,
        wordCount: text.replace(/\s/g, '').length,
        createdAt: Date.now(),
        lastReadAt: Date.now(),
        progress: { ch: 0, page: 0, ratio: 0 },
        bookmarks: []
      };
      await dbPut('books', book);
      state.books.push(book);
      ok++;
    } catch (e) {
      fail++;
    }
  }
  renderShelf();
  if (ok && !fail) toast('已导入 ' + ok + ' 本');
  else if (ok && fail) toast('导入 ' + ok + ' 本，' + fail + ' 个文件失败');
  else toast('导入失败，请确认是 txt 文件');
}
/* ==================== 阅读器核心 ==================== */
function currentRatio() {
  if (!state.cur) return 0;
  if (state.mode === 'page') return state.totalPages > 1 ? state.page / (state.totalPages - 1) : 0;
  const m = pagerEl.scrollHeight - pagerEl.clientHeight;
  return m > 0 ? pagerEl.scrollTop / m : 0;
}

async function openBook(id) {
  let b = state.books.find(x => x.id === id);
  if (!b) b = await dbGet('books', id);
  if (!b) return;
  state.cur = b;
  const pr = b.progress || {};
  state.chIdx = Math.min(pr.ch || 0, b.chapters.length - 1);
  const startRatio = pr.ratio || 0;
  $('rhBook').textContent = b.title;
  shelfEl.classList.remove('active');
  readerEl.classList.add('active');
  hideBars();
  closeSheets();
  setMode(state.mode, true, () => {
    renderChapter(() => {
      if (state.mode === 'page') {
        state.page = Math.round(startRatio * (state.totalPages - 1));
        applyPage(true);
      } else {
        const m = pagerEl.scrollHeight - pagerEl.clientHeight;
        pagerEl.scrollTop = startRatio * m;
      }
      updateProgressUI();
    });
  });
}

function setMode(m, silent, done) {
  state.mode = m;
  state.settings.mode = m;
  if (!silent) saveSettings();
  pagerEl.classList.toggle('mode-page', m === 'page');
  pagerEl.classList.toggle('mode-scroll', m === 'scroll');
  if (m === 'scroll') {
    innerEl.style.transform = 'none';
    innerEl.style.columnWidth = 'auto';
    innerEl.style.height = 'auto';
  }
  syncSettingUI();
  if (done) done();
}

function renderChapter(after) {
  const b = state.cur;
  if (!b) return;
  const ch = b.chapters[state.chIdx] || { title: '', text: '' };
  const paras = (ch.text || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (!paras.length) {
    innerEl.innerHTML = '<div class="empty-ch">本章暂无内容</div>';
  } else {
    innerEl.innerHTML = '<h2>' + esc(ch.title) + '</h2>' +
      paras.map(p => '<p>' + esc(p) + '</p>').join('');
  }
  $('rhChap').textContent = ch.title;
  updateBookmarkBtn();

  if (state.mode === 'page') {
    requestAnimationFrame(() => {
      layoutPages();
      if (after) after();
      updateProgressUI();
    });
  } else {
    pagerEl.scrollTop = 0;
    requestAnimationFrame(() => {
      if (after) after();
      updateProgressUI();
    });
  }
}

function layoutPages() {
  const s = state.settings;
  pagerEl.style.paddingLeft = s.pad + 'px';
  pagerEl.style.paddingRight = s.pad + 'px';
  const w = pagerEl.clientWidth;
  const h = pagerEl.clientHeight;
  const gap = s.pad * 2;
  innerEl.style.columnWidth = w + 'px';
  innerEl.style.columnGap = gap + 'px';
  innerEl.style.height = h + 'px';
  innerEl.style.transform = 'translateX(0px)';
  void innerEl.offsetHeight;
  const total = Math.max(1, Math.round((innerEl.scrollWidth + gap) / (w + gap)));
  state.totalPages = total;
  state.step = w + gap;
  if (state.page > total - 1) state.page = total - 1;
  if (state.page < 0) state.page = 0;
}

function applyPage(instant) {
  if (state.mode !== 'page') return;
  innerEl.style.transition = instant ? 'none' : '';
  innerEl.style.transform = 'translateX(' + (-state.page * state.step) + 'px)';
}

function updateProgressUI() {
  const b = state.cur;
  if (!b) return;
  const totalCh = b.chapters.length;
  let pct;
  if (state.mode === 'page') {
    const chRatio = state.totalPages > 1 ? state.page / (state.totalPages - 1) : 0;
    pct = (state.chIdx + chRatio) / totalCh * 100;
    $('progLeft').textContent = Math.round(pct) + '%';
    $('progRight').textContent = (state.page + 1) + '/' + state.totalPages;
    $('progressRange').value = Math.round(pct);
    rPageNum.textContent = (state.page + 1) + ' / ' + state.totalPages;
  } else {
    const max = pagerEl.scrollHeight - pagerEl.clientHeight;
    const chRatio = max > 0 ? pagerEl.scrollTop / max : 0;
    pct = (state.chIdx + chRatio) / totalCh * 100;
    $('progLeft').textContent = Math.round(pct) + '%';
    $('progRight').textContent = (state.chIdx + 1) + '/' + totalCh;
    $('progressRange').value = Math.round(pct);
    rPageNum.textContent = '';
  }
}

function nextPage() {
  if (!state.cur) return;
  if (state.page < state.totalPages - 1) {
    state.page++;
    applyPage(false);
    updateProgressUI();
    saveProgress();
  } else if (state.chIdx < state.cur.chapters.length - 1) {
    gotoChapter(state.chIdx + 1, 0);
  } else {
    toast('已经是最后一页了');
  }
}
function prevPage() {
  if (!state.cur) return;
  if (state.page > 0) {
    state.page--;
    applyPage(false);
    updateProgressUI();
    saveProgress();
  } else if (state.chIdx > 0) {
    gotoChapter(state.chIdx - 1, 1);
  } else {
    toast('已经是第一页了');
  }
}

function gotoChapter(idx, ratio) {
  const b = state.cur;
  if (!b || idx < 0 || idx >= b.chapters.length) return;
  state.chIdx = idx;
  state.page = 0;
  renderChapter(() => {
    if (state.mode === 'page') {
      state.page = Math.round((ratio || 0) * (state.totalPages - 1));
      applyPage(true);
    } else {
      const m = pagerEl.scrollHeight - pagerEl.clientHeight;
      pagerEl.scrollTop = (ratio || 0) * m;
    }
    updateProgressUI();
    saveProgress();
  });
}

let saveTimer = null;
function saveProgress() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgressNow, 500);
}
function saveProgressNow() {
  const b = state.cur;
  if (!b) return;
  b.progress = { ch: state.chIdx, ratio: currentRatio() };
  b.lastReadAt = Date.now();
  dbPut('books', b);
}

/* ==================== 书签 ==================== */
function updateBookmarkBtn() {
  const b = state.cur;
  if (!b) return;
  const r = currentRatio();
  const on = (b.bookmarks || []).some(x => x.ch === state.chIdx && Math.abs(x.ratio - r) < 0.12);
  $('btnBookmark').classList.toggle('on', on);
}
function toggleBookmark() {
  const b = state.cur;
  if (!b) return;
  const r = currentRatio();
  b.bookmarks = b.bookmarks || [];
  const i = b.bookmarks.findIndex(x => x.ch === state.chIdx && Math.abs(x.ratio - r) < 0.12);
  if (i >= 0) {
    b.bookmarks.splice(i, 1);
    toast('已取消书签');
  } else {
    b.bookmarks.push({ ch: state.chIdx, ratio: r, t: Date.now() });
    toast('已添加书签');
  }
  dbPut('books', b);
  updateBookmarkBtn();
}

/* ==================== 目录 ==================== */
function renderToc() {
  const b = state.cur;
  if (!b) return;
  let html = '';
  b.chapters.forEach((c, i) => {
    html += '<div class="toc-item ' + (i === state.chIdx ? 'on' : '') + '" data-ch="' + i + '">' +
      '<span class="n">' + (i + 1) + '</span><span class="t">' + esc(c.title) + '</span></div>';
  });
  $('tocBody').innerHTML = html;
  const active = $('tocBody').querySelector('.toc-item.on');
  if (active) setTimeout(() => active.scrollIntoView({ block: 'center' }), 60);
}

/* ==================== 阅读器栏 ==================== */
let barsVisible = false;
function showBars() { barsVisible = true; rTop.classList.add('show'); rBottom.classList.add('show'); }
function hideBars() { barsVisible = false; rTop.classList.remove('show'); rBottom.classList.remove('show'); }
function toggleBars() { barsVisible ? hideBars() : showBars(); }

function closeReader() {
  saveProgressNow();
  hideBars();
  readerEl.classList.remove('active');
  shelfEl.classList.add('active');
  state.cur = null;
  renderShelf();
}
/* ==================== 抽屉控制 ==================== */
function openSheet(id) {
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
  maskEl.classList.add('show');
  $(id).classList.add('show');
}
function closeSheets() {
  maskEl.classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('show'));
}

/* ==================== 分类管理 ==================== */
function openCatManage() {
  renderCatManage();
  openSheet('catSheet');
}
function renderCatManage() {
  let html = '';
  if (!state.categories.length) {
    html = '<div style="padding:22px 4px;color:#b0a494;font-size:13.5px;line-height:1.7">还没有分类。<br>在下方输入名称，建立你自己的分类（如：言情、悬疑、短篇）。</div>';
  }
  state.categories.forEach((c, i) => {
    const n = state.books.filter(b => b.category === c).length;
    html += '<div class="cat-row"><span class="name">' + esc(c) +
      '<span style="color:#c3b6a3;font-size:12px;margin-left:8px">' + n + ' 本</span></span>' +
      '<button class="del" data-delcat="' + i + '">删除</button></div>';
  });
  $('catList').innerHTML = html;
}
async function addCategory() {
  const v = $('catNewInput').value.trim();
  if (!v) return toast('请输入分类名称');
  if (state.categories.indexOf(v) >= 0) return toast('已有同名分类');
  state.categories.push(v);
  await metaSet('categories', state.categories);
  $('catNewInput').value = '';
  renderCatManage();
  renderCats();
  toast('已添加分类「' + v + '」');
}
async function deleteCategory(i) {
  const name = state.categories[i];
  state.categories.splice(i, 1);
  await metaSet('categories', state.categories);
  for (const b of state.books) {
    if (b.category === name) { b.category = ''; await dbPut('books', b); }
  }
  if (state.curCat === name) state.curCat = 'all';
  renderCatManage();
  renderShelf();
  toast('已删除分类');
}

/* ==================== 书籍操作 ==================== */
function openBookActions(id) {
  state.actBookId = id;
  const b = state.books.find(x => x.id === id);
  if (!b) return;
  $('actTitle').textContent = b.title;
  let chips = '<button class="chip ' + (b.category ? '' : 'on') + '" data-setcat="">未分类</button>';
  state.categories.forEach(c => {
    chips += '<button class="chip ' + (b.category === c ? 'on' : '') + '" data-setcat="' + esc(c) + '">' + esc(c) + '</button>';
  });
  $('actBody').innerHTML =
    '<div class="set-label">归入分类</div>' +
    '<div class="seg" id="actCatSeg" style="margin-bottom:20px">' + chips + '</div>' +
    '<div class="set-label">修改书名</div>' +
    '<div class="cat-input-row" style="margin-bottom:22px">' +
      '<input id="renameInput" maxlength="40" value="' + esc(b.title) + '">' +
      '<button class="done" id="btnRename" style="background:#f5eee2;border-radius:12px;padding:0 18px">保存</button>' +
    '</div>' +
    '<button class="act-item" id="actExport">' +
      '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 19h16"/></svg>导出为 txt</button>' +
    '<button class="act-item danger" id="actDelete">' +
      '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>删除这本书</button>';

  openSheet('actSheet');

  $('actCatSeg').onclick = e => {
    const c = e.target.closest('[data-setcat]');
    if (!c) return;
    b.category = c.dataset.setcat;
    dbPut('books', b);
    renderShelf();
    toast(b.category ? '已归入「' + b.category + '」' : '已移出分类');
    openBookActions(id);
  };
  $('btnRename').onclick = () => {
    const v = $('renameInput').value.trim();
    if (!v) return toast('书名不能为空');
    b.title = v;
    dbPut('books', b);
    renderShelf();
    closeSheets();
    toast('书名已更新');
  };
  $('actExport').onclick = () => {
    const blob = new Blob([b.content || ''], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = b.title + '.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    toast('正在导出…');
  };
  let pendingDelete = false;
  const delBtn = $('actDelete');
  delBtn.onclick = async () => {
    if (!pendingDelete) {
      pendingDelete = true;
      delBtn.innerHTML = '再点一次，确认删除';
      delBtn.style.background = '#fbeae8';
      return;
    }
    await dbDel('books', id);
    state.books = state.books.filter(x => x.id !== id);
    closeSheets();
    renderShelf();
    toast('已删除《' + b.title + '》');
  };
}

/* ==================== 备份 ==================== */
async function exportBackup() {
  const books = await dbAll('books');
  const data = { app: 'modu-reader', ver: 1, exportedAt: Date.now(), books: books, categories: state.categories, settings: state.settings };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date();
  a.download = '墨读备份_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('备份已导出');
}
async function importBackup(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.books || !Array.isArray(data.books)) throw new Error('bad');
    let added = 0;
    for (const b of data.books) {
      const exist = await dbGet('books', b.id);
      if (!exist) { await dbPut('books', b); state.books.push(b); added++; }
    }
    if (data.categories && Array.isArray(data.categories)) {
      data.categories.forEach(c => { if (state.categories.indexOf(c) < 0) state.categories.push(c); });
      await metaSet('categories', state.categories);
    }
    renderShelf();
    toast(added ? ('已恢复 ' + added + ' 本') : '没有新的书籍可恢复');
  } catch (e) {
    toast('备份文件无法识别');
  }
}

/* ==================== 重排版 ==================== */
function relayout() {
  if (!state.cur) return;
  const r = currentRatio();
  if (state.mode === 'page') {
    layoutPages();
    state.page = Math.round(r * (state.totalPages - 1));
    applyPage(true);
    updateProgressUI();
  } else {
    const m = pagerEl.scrollHeight - pagerEl.clientHeight;
    pagerEl.scrollTop = r * m;
    updateProgressUI();
  }
}

/* ==================== 书架事件 ==================== */
function bindShelfEvents() {
  $('btnImport').onclick = () => $('fileInput').click();
  $('emptyBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = e => { handleFiles(e.target.files); e.target.value = ''; };

  $('btnSearch').onclick = () => {
    const w = $('searchWrap');
    w.classList.toggle('open');
    if (w.classList.contains('open')) {
      setTimeout(() => $('searchInput').focus(), 120);
    } else {
      $('searchInput').value = '';
      state.query = '';
      renderShelf();
    }
  };
  let qt = null;
  $('searchInput').oninput = e => {
    clearTimeout(qt);
    const v = e.target.value;
    qt = setTimeout(() => { state.query = v; renderShelf(); }, 180);
  };

  catBarEl.onclick = e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const c = chip.dataset.cat;
    if (c === '__add') { openCatManage(); return; }
    state.curCat = c;
    renderShelf();
    $('shelfBody').scrollTop = 0;
  };

  bookListEl.onclick = e => {
    const more = e.target.closest('.bi-more');
    if (more) { e.stopPropagation(); openBookActions(more.dataset.more); return; }
    const item = e.target.closest('.book-item');
    if (item) openBook(item.dataset.id);
  };

  $('btnMore').onclick = () => openSheet('moreSheet');
  $('mCatManage').onclick = () => { closeSheets(); setTimeout(openCatManage, 280); };
  $('mReadSet').onclick = () => { closeSheets(); setTimeout(() => openSheet('setSheet'), 280); };
  $('mExport').onclick = () => { closeSheets(); exportBackup(); };
  $('mImportBak').onclick = () => { closeSheets(); $('bakInput').click(); };
  $('bakInput').onchange = e => {
    if (e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  };
  $('btnAddCat').onclick = addCategory;
  $('catNewInput').onkeydown = e => { if (e.key === 'Enter') addCategory(); };
  $('catList').onclick = e => {
    const d = e.target.closest('[data-delcat]');
    if (d) deleteCategory(parseInt(d.dataset.delcat));
  };
  $('btnExport').onclick = exportBackup;
  $('btnImportBak').onclick = () => $('bakInput').click();
}

/* ==================== 阅读器事件 ==================== */
let suppressClick = false;
function bindReaderEvents() {
  $('btnBack').onclick = closeReader;
  $('btnBookmark').onclick = toggleBookmark;
  $('btnToc').onclick = () => { renderToc(); openSheet('tocSheet'); };
  $('btnSettings').onclick = () => openSheet('setSheet');
  $('btnPrevCh').onclick = () => {
    if (state.chIdx > 0) gotoChapter(state.chIdx - 1, 0);
    else toast('已经是第一章');
  };
  $('btnNextCh').onclick = () => {
    if (state.cur && state.chIdx < state.cur.chapters.length - 1) gotoChapter(state.chIdx + 1, 0);
    else toast('已经是最后一章');
  };

  $('tocBody').onclick = e => {
    const it = e.target.closest('.toc-item');
    if (!it) return;
    closeSheets();
    gotoChapter(parseInt(it.dataset.ch), 0);
  };

  pagerEl.addEventListener('click', e => {
    if (suppressClick) { suppressClick = false; return; }
    if (barsVisible) { hideBars(); return; }
    if (!state.cur) return;
    if (state.mode !== 'page') { showBars(); return; }
    const w = pagerEl.clientWidth;
    const x = e.clientX;
    if (x < w * 0.33) prevPage();
    else if (x > w * 0.67) nextPage();
    else showBars();
  });

  let tx = 0, ty = 0, moved = false;
  pagerEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    tx = t.clientX; ty = t.clientY; moved = false;
  }, { passive: true });
  pagerEl.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - tx) > 12 || Math.abs(t.clientY - ty) > 12) moved = true;
  }, { passive: true });
  pagerEl.addEventListener('touchend', e => {
    if (!moved) return;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 60);
    if (state.mode !== 'page' || barsVisible) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) nextPage(); else prevPage();
    }
  });

  $('progressRange').onchange = e => {
    if (!state.cur) return;
    const pct = parseInt(e.target.value);
    const totalCh = state.cur.chapters.length;
    const pos = pct / 100 * totalCh;
    let idx = Math.floor(pos);
    if (idx >= totalCh) idx = totalCh - 1;
    gotoChapter(idx, pos - idx);
  };

  pagerEl.addEventListener('scroll', () => {
    if (state.mode !== 'scroll' || !state.cur) return;
    updateProgressUI();
    saveProgress();
  }, { passive: true });

  let rz = null;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if (state.cur) relayout(); }, 200);
  });
}

/* ==================== 设置事件 ==================== */
function bindSettingsEvents() {
  document.querySelectorAll('[data-font]').forEach(b => {
    b.onclick = () => {
      const d = parseInt(b.dataset.font);
      state.settings.fontSize = Math.min(40, Math.max(13, state.settings.fontSize + d));
      applyReaderStyle();
      syncSettingUI();
      saveSettings();
      relayout();
    };
  });
  $('fontSeg').onclick = e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    state.settings.font = b.dataset.f;
    applyReaderStyle();
    syncSettingUI();
    saveSettings();
    relayout();
  };
  $('lhSeg').onclick = e => {
    const b = e.target.closest('[data-lh]');
    if (!b) return;
    state.settings.lineHeight = parseFloat(b.dataset.lh);
    applyReaderStyle();
    syncSettingUI();
    saveSettings();
    relayout();
  };
  $('padSeg').onclick = e => {
    const b = e.target.closest('[data-pad]');
    if (!b) return;
    state.settings.pad = parseInt(b.dataset.pad);
    applyReaderStyle();
    syncSettingUI();
    saveSettings();
    relayout();
  };
  $('themeSeg').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    state.settings.theme = b.dataset.t;
    applyReaderStyle();
    syncSettingUI();
    saveSettings();
  };
  $('modeSeg').onclick = e => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const r = currentRatio();
    closeSheets();
    setMode(b.dataset.m, false, () => {
      renderChapter(() => {
        if (state.mode === 'page') {
          state.page = Math.round(r * (state.totalPages - 1));
          applyPage(true);
        } else {
          const m = pagerEl.scrollHeight - pagerEl.clientHeight;
          pagerEl.scrollTop = r * m;
        }
        updateProgressUI();
      });
    });
  };
  $('brightRange').oninput = e => {
    state.settings.brightness = parseInt(e.target.value);
    $('brightness').style.opacity = (state.settings.brightness / 100).toFixed(2);
  };
  $('brightRange').onchange = () => saveSettings();
}

/* ==================== 初始化 ==================== */
async function boot() {
  try {
    await openDB();
  } catch (e) {
    toast('当前环境不支持本地存储');
    return;
  }
  state.books = await dbAll('books');
  state.categories = await metaGet('categories', []);
  await loadSettings();
  pagerEl.style.paddingLeft = state.settings.pad + 'px';
  pagerEl.style.paddingRight = state.settings.pad + 'px';
  setMode(state.mode, true);
  renderShelf();
  bindShelfEvents();
  bindReaderEvents();
  bindSettingsEvents();
  maskEl.addEventListener('click', closeSheets);
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));
  state.ready = true;
}

window.__handleBack = function () {
  if (document.querySelector('.sheet.show')) { closeSheets(); return true; }
  if (readerEl.classList.contains('active')) { closeReader(); return true; }
  return false;
};

boot();
</script>
